<div class="media-box" id="media-{{ card.card_id }}">
  {% if (card.image or {}).get('mode') != 'none' %}<img src="/jobs/{{ job.job_id }}/media/{{ card.card_id }}?v={{ card.updated_at }}" alt="Кадр карточки"><small>{{ card.image.timestamp or '' }} сек.</small>{% else %}<div class="no-image">Без изображения</div>{% endif %}
  <form hx-post="/jobs/{{ job.job_id }}/review/cards/{{ card.card_id }}/image-remove" hx-target="#media-{{ card.card_id }}" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Убрать изображение</button></form>
  {% if not card.alternatives %}<form hx-post="/jobs/{{ job.job_id }}/review/cards/{{ card.card_id }}/image-candidates" hx-target="#media-{{ card.card_id }}" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Показать варианты кадров</button></form>{% endif %}
  {% if card.alternatives %}<div class="candidate-grid" aria-label="Альтернативные кадры">
  {% for alternative in card.alternatives %}<form hx-post="/jobs/{{ job.job_id }}/review/cards/{{ card.card_id }}/image-select" hx-target="#media-{{ card.card_id }}" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="path" value="{{ alternative.path }}"><input type="hidden" name="timestamp" value="{{ alternative.timestamp }}"><button class="candidate" title="Выбрать кадр на {{ '%.1f'|format(alternative.timestamp) }} секунде"><img src="/jobs/{{ job.job_id }}/review/cards/{{ card.card_id }}/image-candidates/{{ loop.index0 }}" alt="Кадр на {{ '%.1f'|format(alternative.timestamp) }} секунде"><span>{{ '%.1f'|format(alternative.timestamp) }} с · score {{ '%.2f'|format(alternative.quality_score) }}</span></button></form>{% endfor %}
  </div>{% endif %}
  <form hx-post="/jobs/{{ job.job_id }}/review/cards/{{ card.card_id }}/image-upload" hx-target="#media-{{ card.card_id }}" hx-swap="outerHTML" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="file" name="image" accept="image/jpeg,image/png,image/webp" required><button>Загрузить своё</button></form>
</div>
