{% extends "base.html" %}
{% block title %}Новая колода · anki-pipeline{% endblock %}
{% block content %}
<form class="panel start-card" method="post" action="/projects" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Название проекта (необязательно)<input name="project_name" maxlength="120" placeholder="По умолчанию: ГГГГ-ММ-ДД-ХЭШ"></label>
  <label>Ответ LLM<small>Одна строка: ID | type | question | answer</small><textarea name="cards_text" rows="12" placeholder="1 | recall | Что такое градиент? | Вектор частных производных."></textarea></label>
  <div class="or">или</div>
  <label>Текстовый файл<input name="cards_file" type="file" accept=".txt,text/plain"></label>
  <button class="primary" type="submit">Проверить карточки</button>
  <a class="secondary" href="/prompt" target="_blank">Открыть промпт для LLM</a>
</form>

{% if projects %}
<section class="panel projects">
  <h2>Проекты</h2>
  {% for project in projects %}
  <a class="project-row" href="/projects/{{ project.id }}"><strong>{{ project.name }}</strong><span>{{ project.cards|length }} карточек</span><b>Открыть →</b></a>
  {% endfor %}
</section>
{% endif %}
{% endblock %}
